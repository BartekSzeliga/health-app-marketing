appId: com.helti.app
---
- swipe:
    start: 50%, 77%
    end: 50%, 38%
    duration: 1900
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Instrukcja"
      index: 1
    direction: DOWN
    timeout: 20000
    speed: 35
    visibilityPercentage: 80
- tapOn:
    text: "Instrukcja"
    index: 1
- waitForAnimationToEnd
- swipe:
    start: 50%, 75%
    end: 50%, 58%
    duration: 1300
- waitForAnimationToEnd
